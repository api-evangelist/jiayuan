description: >-
  Jiayuan (世纪佳缘, jiayuan.com) is one of China's largest online dating and serious-relationship
  matchmaking platforms, connecting members seeking marriage and long-term relationships through
  profile matching, search, messaging, and offline matchmaking services delivered on web and mobile
  apps. Founded in 2003 and later part of the Baihe Jiayuan group, it operates as a consumer-facing
  social/dating product. It was surfaced as a portfolio company of Qiming and added to the API
  Evangelist network as a company profile; it does not appear to publish a public developer API
  program, so this profile carries company identity and probed domain-security signals rather than
  API artifacts.
